name: Publish Pending WordPress Posts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wp_pending/**.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish all pending posts to WordPress
        env:
          WP_URL: https://blog.minmaxmuscle.com
          WP_USER: drew@teqh.com
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python3 scripts/publish_wp_pending.py
