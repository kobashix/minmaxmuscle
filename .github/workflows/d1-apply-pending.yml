name: Apply Pending D1 Inserts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'd1_pending/**.sql'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply all pending SQL files to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/apply_d1_pending.py
